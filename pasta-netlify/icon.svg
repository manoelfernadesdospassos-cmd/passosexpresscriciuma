<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="240" r="190" fill="#10b981" opacity="0.1" />

  <!-- Delivery Car Silhouette -->
  <g transform="translate(64, 110) scale(0.75)">
    <!-- Car Body -->
    <path d="M 50 240 L 90 140 C 110 90, 160 80, 210 80 L 320 80 C 370 80, 420 120, 440 180 L 480 240 C 500 240, 510 260, 510 280 L 510 320 C 510 340, 490 350, 470 350 L 440 350 C 440 300, 390 270, 340 270 C 290 270, 250 300, 250 350 L 190 350 C 190 300, 140 270, 90 270 C 40 270, 10 300, 10 350 L 0 350 C -10 340, -10 280, 10 260 Z" fill="url(#emeraldGrad)" />
    
    <!-- Windows -->
    <path d="M 120 150 L 210 100 L 210 210 L 80 210 Z" fill="#0f172a" opacity="0.85" />
    <path d="M 230 100 L 320 100 C 350 100, 380 120, 395 160 L 415 210 L 230 210 Z" fill="#0f172a" opacity="0.85" />
    
    <!-- Wheels -->
    <circle cx="90" cy="350" r="45" fill="#0f172a" stroke="#10b981" stroke-width="12" />
    <circle cx="90" cy="350" r="18" fill="#f8fafc" />
    <circle cx="340" cy="350" r="45" fill="#0f172a" stroke="#10b981" stroke-width="12" />
    <circle cx="340" cy="350" r="18" fill="#f8fafc" />

    <!-- Headlight in Gold -->
    <polygon points="480,240 510,240 500,270 470,265" fill="#f59e0b" />
    
    <!-- Speed Lines -->
    <line x1="-30" y1="210" x2="30" y2="210" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
    <line x1="-50" y1="250" x2="0" y2="250" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  </g>
  
  <!-- Brand Text -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle" letter-spacing="4">PASSOS EXPRESS</text>
  <text x="256" y="475" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#34d399" text-anchor="middle" letter-spacing="3">ENTREGAS DE CARRO · CRICIÚMA</text>
</svg>
