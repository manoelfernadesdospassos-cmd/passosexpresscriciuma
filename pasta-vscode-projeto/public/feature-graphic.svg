<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)" />
  <circle cx="300" cy="250" r="320" fill="url(#glow)" />

  <!-- Delivery Car Graphic on Left -->
  <g transform="translate(80, 100) scale(0.9)">
    <!-- Car Body -->
    <path d="M 50 240 L 90 140 C 110 90, 160 80, 210 80 L 320 80 C 370 80, 420 120, 440 180 L 480 240 C 500 240, 510 260, 510 280 L 510 320 C 510 340, 490 350, 470 350 L 440 350 C 440 300, 390 270, 340 270 C 290 270, 250 300, 250 350 L 190 350 C 190 300, 140 270, 90 270 C 40 270, 10 300, 10 350 L 0 350 C -10 340, -10 280, 10 260 Z" fill="url(#carGrad)" />
    
    <!-- Windows -->
    <path d="M 120 150 L 210 100 L 210 210 L 80 210 Z" fill="#0b1120" opacity="0.9" />
    <path d="M 230 100 L 320 100 C 350 100, 380 120, 395 160 L 415 210 L 230 210 Z" fill="#0b1120" opacity="0.9" />
    
    <!-- Wheels -->
    <circle cx="90" cy="350" r="45" fill="#0b1120" stroke="#10b981" stroke-width="12" />
    <circle cx="90" cy="350" r="18" fill="#f8fafc" />
    <circle cx="340" cy="350" r="45" fill="#0b1120" stroke="#10b981" stroke-width="12" />
    <circle cx="340" cy="350" r="18" fill="#f8fafc" />

    <!-- Headlight -->
    <polygon points="480,240 510,240 500,270 470,265" fill="#f59e0b" />
    
    <!-- Speed Lines -->
    <line x1="-30" y1="210" x2="30" y2="210" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
    <line x1="-50" y1="250" x2="0" y2="250" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Typography on Right -->
  <text x="560" y="190" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="2">PASSOS EXPRESS</text>
  <text x="560" y="240" font-family="Arial, sans-serif" font-weight="800" font-size="28" fill="#34d399" letter-spacing="1">ENTREGAS DE CARRO</text>
  <text x="560" y="285" font-family="Arial, sans-serif" font-weight="500" font-size="20" fill="#94a3b8">Criciúma &amp; Região Carbonífera · SC</text>
  
  <!-- Highlights tags -->
  <g transform="translate(560, 320)">
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="90" y="24" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#f8fafc" text-anchor="middle">📦 Porta-malas Amplo</text>

    <rect x="195" y="0" width="185" height="38" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="287" y="24" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#f8fafc" text-anchor="middle">🌧️ 100% Sem Chuva</text>
  </g>
</svg>
